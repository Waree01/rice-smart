name: CI

# Mirrors the local 7-agent checks:
# - analyze         → @flutter-specialist + @code-reviewer
# - test-coverage   → @test-runner
# - security-sast   → @security-auditor (Semgrep)
# - security-sca    → @security-auditor (Trivy)
# - security-secrets→ @security-auditor (TruffleHog + Gitleaks)
# - build-android   → final build sanity check
# - build-ios       → final build sanity check (PR only)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-flight runs on the same branch
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.7'
  JAVA_VERSION: '17'

permissions:
  contents: read
  pull-requests: write   # for posting review comments
  security-events: write # for SARIF upload to Security tab

jobs:
  # ---------------------------------------------------------------------------
  analyze:
    name: Analyze (flutter analyze + format)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Static analysis
        run: flutter analyze --fatal-infos

  # ---------------------------------------------------------------------------
  test-coverage:
    name: Test + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: analyze
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage --reporter github

      - name: Verify coverage thresholds
        run: |
          sudo apt-get update -qq && sudo apt-get install -y lcov
          COVERAGE=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines" | awk '{print $2}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          # AI services tests (RAG, embedding, benchmark, multimodal, voice) added
          # Coverage threshold raised from 15% to 80% per CLAUDE.md spec
          THRESHOLD=80
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "::error::Coverage ${COVERAGE}% below threshold ${THRESHOLD}%"
            exit 1
          fi

      - name: Upload to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  security-sast:
    name: Security — SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/dart
            p/owasp-top-ten
            p/secrets
            p/security-audit
            p/flutter
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true

  # ---------------------------------------------------------------------------
  security-sca:
    name: Security — Dependencies (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  # ---------------------------------------------------------------------------
  security-secrets:
    name: Security — Secret detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history needed for secret scan

      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          head: HEAD
          extra_args: --only-verified

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [analyze, test-coverage]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ricesmart-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # ---------------------------------------------------------------------------
  build-ios:
    name: Build iOS (debug, no codesign)
    runs-on: macos-14
    timeout-minutes: 30
    needs: [analyze, test-coverage]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios && pod install --repo-update

      - name: Build iOS (no codesign)
        run: flutter build ios --debug --no-codesign

  # ---------------------------------------------------------------------------
  ci-success:
    name: CI Passed
    runs-on: ubuntu-latest
    needs:
      - analyze
      - test-coverage
      - security-sast
      - security-sca
      - security-secrets
      - build-android
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "::error::One or more required jobs failed"
            exit 1
          fi
          if [[ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "::error::One or more required jobs were cancelled"
            exit 1
          fi
          echo "All required CI jobs passed."
