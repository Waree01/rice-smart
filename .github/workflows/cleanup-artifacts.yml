name: Cleanup Artifacts

# Automatically delete build artifacts when a PR is closed or merged
on:
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  cleanup:
    name: Delete PR artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: geekyeggo/delete-artifact@v4
        with:
          name: ricesmart-debug-apk
          failOnError: false
