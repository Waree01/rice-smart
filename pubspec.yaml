name: rice_smart
description: >
  AI-powered mobile application to help Thai rice farmers optimize costs
  and increase yield through disease detection, pest identification, and
  an intelligent chatbot named Pasadee (พัสดี).

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.0.0

  # Network & API
  dio: ^5.4.0
  connectivity_plus: ^5.0.2

  # Firebase (commented out — pulls in heavy native pods we don't use yet
  # because Firebase is never actually initialized in main.dart. Re-enable
  # once google-services.json / GoogleService-Info.plist are provisioned.)
  # firebase_core: ^4.7.0
  # firebase_auth: ^6.4.0
  # cloud_firestore: ^6.3.0
  # firebase_messaging: ^16.2.0
  # firebase_analytics: ^12.3.0

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.2
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.1.0

  # AI / ML - On-device Inference
  tflite_flutter: ^0.10.4
  image: ^4.1.4

  # Camera & Image
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  image_cropper: ^12.2.1

  # UI Components
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  fl_chart: ^0.66.2
  lottie: ^3.0.0

  # Localization
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # Utils
  logger: ^2.0.2+1
  flutter_dotenv: ^5.1.0
  permission_handler: ^11.2.0
  geolocator: ^10.1.1
  url_launcher: ^6.2.4
  uuid: ^4.3.3

  # Markdown rendering for chatbot
  flutter_markdown: ^0.6.22

  # Voice interface — Thai speech recognition + TTS
  speech_to_text: ^6.6.0
  flutter_tts: ^4.0.2

  # Geospatial — community disease surveillance
  dart_geohash: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.1

  # Testing
  mockito: ^5.4.4
  mocktail: ^1.0.3
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/models/
    - assets/icons/
    - assets/fonts/
    - assets/knowledge_base/
    # `.env.example` ships empty keys so the app boots even without a local override.
    # Developers copy it to `.env` (gitignored) to inject real credentials.
    # `.env` is NOT listed as an asset because it's gitignored (CI can't access it).
    # Instead, flutter_dotenv loads from a fallback strategy or .env.example.
    - .env.example

  # fonts:
  #   - family: NotoSansThai
  #     fonts:
  #       - asset: assets/fonts/NotoSansThai-Regular.ttf
  #       - asset: assets/fonts/NotoSansThai-Bold.ttf
  #         weight: 700
